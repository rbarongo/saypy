server {
    listen 80;
    server_name localhost;

    # Serve the built SPA; fall back to index.html for client-side routes
    # (App.jsx does its own path-based routing, e.g. /dashboard,
    # /collection_management/collections, /self-register — none of these
    # are real files, so a hard refresh on one must still resolve to the app).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively — Vite fingerprints filenames
    # on every build, so a new deploy naturally busts this cache.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
    }
}
